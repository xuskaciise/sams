name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/claude.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/xuskaciise/sams
  IMAGE_WA: ghcr.io/xuskaciise/sams-whatsapp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push whatsapp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.whatsapp
          push: true
          tags: |
            ${{ env.IMAGE_WA }}:latest
            ${{ env.IMAGE_WA }}:${{ github.sha }}
          cache-from: type=gha,scope=whatsapp
          cache-to: type=gha,mode=max,scope=whatsapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/SAMS

          git fetch --all
          git reset --hard origin/main

          docker pull ghcr.io/xuskaciise/sams:latest
          docker pull ghcr.io/xuskaciise/sams-whatsapp:latest

          /usr/local/bin/db-backup.sh || echo "backup warning"

          docker run --rm --network sams_internal \
            -v /root/SAMS/prisma:/app/prisma \
            -v /root/SAMS/.env.production:/app/env/.env.production:ro \
            -w /app node:20-alpine sh -c "
              apk add --no-cache openssl libc6-compat
              set -a
              . /app/env/.env.production
              set +a
              npx --yes prisma@6.19.3 migrate deploy
            "

          docker compose up -d --no-build

          sleep 15
          if ! curl -sf http://127.0.0.1:3010/ > /dev/null; then
            echo "Health check failed — recent app logs:"
            docker compose logs --tail 50 app
            exit 1
          fi

          docker image prune -f
          REMOTE
